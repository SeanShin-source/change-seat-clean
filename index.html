    <style>
:root {
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:#18253b;
  background:#f3f6fa;
  font-synthesis:none;
  --blue:#2463eb;
  --muted:#65748b;
  --line:#e7ecf3
}

* {
  box-sizing:border-box
}

body {
  margin:0
}

button,input {
  font:inherit
}

button {
  cursor:pointer
}

button:disabled {
  cursor:default
}

button,input {
  -webkit-tap-highlight-color:transparent
}

button:focus-visible,input:focus-visible {
  outline:3px solid #80aaff;
  outline-offset:4px
}

h1,h2,p {
  margin:0
}

[hidden] {
  display:none!important
}

.icon {
  width:22px;
  height:22px;
  flex-shrink:0;
  vertical-align:middle
}

.muted {
  color:var(--muted);
  font-weight:400
}

.button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:46px;
  border-radius:10px;
  border:1px solid transparent;
  font-weight:700;
  transition:background .15s,border-color .15s
}

.primary {
  background:var(--blue);
  color:white
}

.primary:hover:not(:disabled) {
  background:#174fcc
}

.primary:disabled {
  background:#e5ebf5;
  color:#6b7d98
}

.secondary {
  background:white;
  border-color:#dce4ef;
  color:#425875
}

.secondary:hover:not(:disabled),.help-button:hover {
  background:#f0f5ff;
  border-color:#b8cef6
}

.secondary:disabled,.reset-button:disabled {
  color:#8a96a9;
  background:#f7f9fc
}

.brand-mark {
  width:48px;
  height:48px;
  background:#eaf1ff;
  color:var(--blue);
  display:grid;
  place-items:center;
  border-radius:13px
}

.brand-mark .icon {
  width:27px;
  height:27px
}

.app-shell {
  max-width:1600px;
  margin:0 auto;
  padding:22px 28px 12px
}

.app-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  padding:8px 2px
}

.brand {
  display:flex;
  gap:15px;
  align-items:center
}

.brand h1 {
  font-size:28px;
  letter-spacing:-1.2px;
  line-height:1.3
}

.brand p {
  margin-top:4px;
  font-size:14px;
  color:var(--muted)
}

h1:focus {
  outline:none
}

.help-button {
  background:transparent;
  color:#5f7088;
  padding:0 14px;
  font-size:14px
}

.header-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.naver-button { padding: 6px 12px; }
.naver-status { font-size: 13px; }
.naver-status:empty { display: none; }
.logout-dialog { max-width: 380px; }
.logout-dialog p { margin: 10px 0; color: #526582; font-size: 14px; }
.logout-dialog #seat-logout-error { color: #a82437; }
.logout-actions { display: flex; gap: 8px; }
.logout-actions .button { flex: 1; margin-top: 10px; }

.seat-login { width: min(384px, calc(100% - 32px)); padding: 26px; border: 1px solid #d9e3ee; border-radius: 20px; color: #18253b; box-shadow: 0 18px 65px #10233b33; }
.seat-login::backdrop { background: #17274170; }
.seat-login h2 { margin: 0 0 7px; font-size: 24px; }
.seat-login p { color: #526582; margin: 0 0 18px; }
.seat-login-options { display: grid; gap: 10px; }
.seat-login .provider { width: 100%; min-height: 48px; gap: 8px; }
.seat-login .google-provider { color: #1f1f1f; border: 1px solid #747775; background: #fff; }
.seat-login .naver-provider, .seat-login .naver-provider:hover { color: #fff; background: #03a94d; }
.seat-login .provider img, .seat-login .provider svg { display: block; width: 20px; height: 20px; }
.seat-login .naver-provider img { width: 44px; height: 44px; margin: -18px -9px -18px -12px; }
.seat-login #seat-login-status { margin: 12px 0 0; font-size: 13px; }
.seat-login #seat-login-status:empty { display: none; }

.workspace {
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:20px;
  align-items:stretch
}

.card {
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 3px 12px #19396303
}

.settings {
  padding:26px 24px;
  display:flex;
  flex-direction:column
}

.settings h2 {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  letter-spacing:-.6px;
  margin-bottom:20px
}

.step-number {
  background:#edf3ff;
  color:#2c63c7;
  font-size:13px;
  display:inline-grid;
  place-items:center;
  width:25px;
  height:25px;
  border-radius:8px
}

.settings label {
  font-size:14px;
  font-weight:600;
  display:block;
  margin-bottom:10px
}

.number-range {
  display:flex;
  align-items:center;
  gap:10px
}

.range-start {
  height:48px;
  width:53px;
  display:grid;
  place-items:center;
  background:#f5f7fa;
  border:1px solid #e6ebf2;
  border-radius:9px;
  font-size:19px;
  font-weight:600
}

.range-separator {
  color:#8591a4
}

.number-range input {
  width:79px;
  height:48px;
  border:1px solid #cbd6e5;
  border-radius:9px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:#18253b;
  background:white;
  padding-left:7px
}

.number-range input:disabled {
  color:#65748b;
  background:#f5f7fa
}

.number-range input[aria-invalid=true] {
  border-color:#c04a44
}

.student-total {
  font-size:14px;
  white-space:nowrap;
  margin-left:auto
}

.student-total strong {
  color:var(--blue)
}

.hint {
  display:flex;
  gap:8px;
  background:#f6f8fc;
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
  padding:12px;
  border-radius:9px;
  margin-top:14px
}

.hint .icon {
  width:17px;
  height:17px;
  color:#6d8dbb;
  margin-top:3px
}

.seat-settings,.assignment-settings {
  border-top:1px solid var(--line);
  margin-top:24px;
  padding-top:24px
}

.optional {
  font-size:12px;
  font-weight:400;
  color:#8491a4;
  margin-left:auto
}

.section-description {
  font-size:13px;
  line-height:1.85;
  color:var(--muted);
  margin-top:-6px;
  margin-bottom:14px
}

.settings .button {
  width:100%
}

.secondary {
  font-size:14px
}

.secondary .icon {
  width:17px;
  height:17px;
  color:#5c80b5
}

.readiness {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-bottom:14px
}

.readiness strong {
  color:#334a6b;
  margin-left:3px
}

.readiness .insufficient {
  color:#ac403b
}

.settings .primary {
  min-height:51px;
  font-size:17px
}

.reset-button {
  background:transparent;
  color:#748198;
  font-size:13px;
  margin-top:7px;
  min-height:36px
}

.reset-button:hover:not(:disabled) {
  background:#f4f7fb
}

.reset-button .icon {
  width:16px;
  height:16px
}

.settings-footnote {
  font-size:11px;
  color:#8793a4;
  text-align:center;
  padding-top:16px;
  margin-top:auto;
  line-height:1.7
}

.input-error {
  font-size:12px;
  color:#ac403b;
  margin-top:8px
}

.settings-error {
  background:#fff3ef;
  color:#a13f31;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  line-height:1.65;
  margin-bottom:12px
}

.completion-notice {
  display:flex;
  gap:7px;
  background:#f1f6ff;
  border-radius:8px;
  font-size:12px;
  color:#546e98;
  line-height:1.7;
  margin-top:12px;
  padding:10px
}

.completion-notice .icon {
  width:16px;
  height:16px;
  margin-top:2px
}

.classroom {
  padding:24px 30px 0;
  display:flex;
  flex-direction:column
}

.classroom-heading {
  display:flex;
  justify-content:space-between;
  align-items:center
}

.classroom-heading h2 {
  display:inline-block;
  font-size:17px;
  letter-spacing:-.5px
}

.room-dimensions {
  font-size:12px;
  color:#8895a8;
  margin-left:12px
}

.phase-badge {
  padding:6px 10px;
  border-radius:6px;
  background:#f0f5ff;
  color:#5074b6;
  font-size:12px;
  white-space:nowrap
}

.phase-badge.complete {
  background:#edf7f3;
  color:#347961
}

.room {
  width:100%;
  max-width:1050px;
  margin:0 auto;
  padding:14px 12px 0;
  flex:1
}

.front-label {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-size:11px;
  color:#97a3b4;
  letter-spacing:1px;
  margin:0 auto 10px;
  max-width:320px
}

.front-label span {
  width:45px;
  height:1px;
  background:#e8edf4
}

.teacher-desk {
  width:46%;
  height:43px;
  margin:0 auto 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid #dce3ed;
  border-radius:9px;
  background:#f6f8fb;
  font-size:15px;
  font-weight:600;
  letter-spacing:4px;
  color:#65748b
}

.teacher-desk .icon {
  width:20px;
  height:20px
}

.column-labels {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
  margin-bottom:8px;
  text-align:center;
  color:#8d9bb0;
  font-size:11px
}

.seat-grid {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px
}

.seat {
  height:clamp(60px,8vh,94px);
  min-width:0;
  border:1px solid #afcaf3;
  border-radius:11px;
  background:#f3f8ff;
  color:#1b3557;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  transition:background .15s,border-color .15s
}

.seat:hover:not(:disabled) {
  background:#e6f0ff;
  border-color:#4285ee
}

.seat.inactive {
  background:#f0f2f5;
  border-color:#dbe1e9;
  color:#8a94a3
}

.seat.inactive:hover:not(:disabled) {
  background:#e9edf2;
  border-color:#b7c0ce
}

.seat.assigned {
  background:#edf5ff;
  border-color:#83b0f2
}

.seat:disabled {
  opacity:1
}

.seat-number {
  font-size:clamp(23px,2.1vw,36px);
  font-weight:750;
  line-height:1.2;
  font-variant-numeric:tabular-nums
}

.seat-dash {
  font-size:22px;
  font-weight:600;
  line-height:1
}

.seat-caption {
  font-size:11px;
  line-height:1.7
}

.empty-seat-mark {
  width:17px;
  height:3px;
  border-radius:4px;
  background:#c9daf3
}

.back-label {
  text-align:center;
  margin:10px 0 14px;
  font-size:11px;
  color:#97a3b4;
  letter-spacing:1px
}

.seat-footer {
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:17px 0;
  font-size:12px
}

.legend,.legend>span {
  display:flex;
  align-items:center;
  gap:7px
}

.legend {
  gap:18px;
  color:#6c7b90
}

.legend-box {
  display:inline-block;
  width:14px;
  height:14px;
  border-radius:4px;
  background:#eef5ff;
  border:1px solid #9dc1f2
}

.legend-box.inactive {
  background:#f0f2f5;
  border-color:#d4dae3
}

.seat-counter {
  display:flex;
  gap:12px;
  color:#768499;
  white-space:nowrap
}

.seat-counter strong {
  font-size:15px;
  font-weight:700;
  color:var(--blue);
  margin-left:4px
}

.seat-counter #inactive-count {
  color:#6d7c90
}

.counter-divider {
  color:#d5dce6
}

.page-footer {
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 3px 0;
  font-size:11px;
  color:#8995a6
}

.welcome {
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:32px 20px
}

.welcome-card {
  max-width:670px;
  width:100%;
  padding:38px 44px 26px;
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 12px 50px #173b6905;
  text-align:center
}

.brand-mark.large {
  margin:0 auto 18px;
  width:60px;
  height:60px;
  border-radius:17px
}

.brand-mark.large .icon {
  width:32px;
  height:32px
}

.eyebrow {
  font-size:12px;
  color:#6683b3;
  letter-spacing:1px;
  margin-bottom:9px
}

.welcome h1 {
  font-size:27px;
  letter-spacing:-1.3px;
  line-height:1.4
}

.welcome-subtitle {
  font-size:14px;
  color:var(--muted);
  margin-top:12px;
  line-height:1.7
}

.notice-list {
  counter-reset:notice;
  list-style:none;
  padding:0;
  margin:26px 0;
  text-align:left;
  display:grid;
  gap:18px
}

.notice-list li {
  display:flex;
  gap:12px;
  font-size:14px;
  line-height:1.75;
  color:#52617a
}

.notice-list li:before {
  counter-increment:notice;
  content:counter(notice);
  display:inline-grid;
  place-items:center;
  width:24px;
  height:24px;
  flex-shrink:0;
  background:#f0f4f9;
  color:#7a8ba3;
  border-radius:7px;
  font-size:12px;
  font-weight:700
}

.notice-highlight {
  display:flex;
  gap:10px;
  align-items:flex-start;
  text-align:left;
  background:#f2f6fe;
  border:1px solid #e6edfa;
  border-radius:12px;
  padding:17px;
  color:#42638e;
  font-size:13px;
  line-height:1.8
}

.notice-highlight .icon {
  width:19px;
  height:19px;
  margin-top:2px
}

.notice-highlight span {
  font-size:12px;
  color:#7a8ba5
}

.start-button {
  margin-top:24px;
  min-height:54px;
  width:100%;
  font-size:16px
}

.welcome-footer {
  color:#98a4b4;
  font-size:11px;
  margin-top:20px
}

.help-dialog {
  border:1px solid var(--line);
  border-radius:18px;
  max-width:550px;
  width:calc(100% - 36px);
  padding:30px;
  color:#18253b
}

.help-dialog::backdrop {
  background:#17274455
}

.help-dialog h2 {
  font-size:22px
}

.help-dialog .button {
  width:100%;
  margin-top:20px
}

.help-dialog .hint {
  display:block
}

.countdown-overlay {
  position:fixed;
  inset:0;
  background:#101e334a;
  display:grid;
  place-items:center;
  z-index:20;
  padding:20px;
  backdrop-filter:blur(3px)
}

.countdown-card {
  width:370px;
  max-width:100%;
  border-radius:22px;
  background:white;
  text-align:center;
  padding:36px 24px 30px;
  box-shadow:0 20px 70px #1727441f
}

.countdown-card p {
  font-size:18px;
  font-weight:600
}

.countdown-number {
  font-size:132px;
  line-height:1.5;
  color:var(--blue);
  font-weight:700;
  font-variant-numeric:tabular-nums
}

.countdown-card>span {
  font-size:13px;
  color:#8290a4
}

@media(min-width:1600px) {
  .app-shell {
    padding-top:36px
  }
  .workspace {
    grid-template-columns:340px minmax(0,1fr);
    gap:24px
  }
  .settings {
    padding:32px 28px
  }
  .classroom {
    padding:28px 38px 0
  }
  .app-header {
    margin-bottom:26px
  }
  .settings h2 {
    font-size:20px
  }
  .settings label,.section-description,.student-total {
    font-size:15px
  }
  .hint {
    font-size:14px
  }
  .seat-settings,.assignment-settings {
    margin-top:32px;
    padding-top:32px
  }
  .readiness {
    font-size:14px
  }
  .classroom-heading h2 {
    font-size:20px
  }
  .room {
    padding-top:22px
  }
  .teacher-desk {
    height:48px;
    margin-bottom:20px
  }
  .seat-grid {
    gap:15px
  }
  .seat-footer {
    padding:23px 0;
    font-size:14px
  }
  .seat-caption {
    font-size:13px
  }
  .settings-footnote {
    font-size:12px
  }
}

@media(max-width:1100px) {
  .app-shell {
    padding:18px
  }
  .workspace {
    grid-template-columns:285px minmax(0,1fr);
    gap:16px
  }
  .settings {
    padding:22px 18px
  }
  .classroom {
    padding:22px 18px 0
  }
  .room {
    padding-left:0;
    padding-right:0
  }
  .room-dimensions {
    display:block;
    margin:5px 0 0
  }
  .seat-grid,.column-labels {
    gap:8px
  }
  .seat-footer {
    flex-wrap:wrap;
    justify-content:center
  }
  .seat-counter {
    gap:8px
  }
}

@media(max-width:760px) {
  .app-shell {
    padding:16px 12px
  }
  .app-header {
    margin-bottom:14px
  }
  .brand {
    gap:10px
  }
  .brand-mark {
    width:42px;
    height:42px
  }
  .brand h1 {
    font-size:23px
  }
  .brand p {
    font-size:11px
  }
  .help-button {
    padding:0 6px;
    gap:5px;
    font-size:12px
  }
  .help-button .icon {
    width:18px;
    height:18px
  }
  .workspace {
    display:flex;
    flex-direction:column;
    gap:14px
  }
  .settings {
    padding:20px
  }
  .settings h2 {
    margin-bottom:14px
  }
  .seat-settings,.assignment-settings {
    margin-top:18px;
    padding-top:18px
  }
  .settings-footnote {
    padding-top:10px
  }
  .classroom {
    padding:20px 14px 0
  }
  .room {
    padding-top:16px
  }
  .seat-grid,.column-labels {
    gap:7px
  }
  .seat {
    height:58px;
    border-radius:8px
  }
  .seat-number {
    font-size:24px
  }
  .seat-caption {
    font-size:10px
  }
  .teacher-desk {
    width:52%;
    height:38px
  }
  .seat-footer {
    font-size:11px;
    padding:14px 0
  }
  .legend {
    gap:13px
  }
  .page-footer {
    justify-content:center;
    line-height:1.7;
    text-align:center
  }
  .page-footer>span:first-child {
    display:none
  }
  .welcome {
    padding:18px 12px
  }

    <script>
function isValidStudentCount(value) {
  return Number.isInteger(value) && value >= 1 && value <= 30;
}

function parseStudentCount(value) {
  if (!/^\d+$/.test(String(value))) return null;
  const count = Number(value);
  return isValidStudentCount(count) ? count : null;
}

function validateSettings(studentCount, seats) {
  if (!isValidStudentCount(studentCount)) return '학생 수는 1명부터 30명까지 입력해주세요.';
  if (seats.filter((seat) => seat.active).length < studentCount) {
    return '학생 수보다 사용 가능한 좌석이 부족합니다.';
  }
  return '';
}



function shuffleArray(array, random = Math.random) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function verifyAssignments(studentCount, seats) {
  const assigned = seats.filter((seat) => seat.student !== null);
  const numbers = assigned.map((seat) => seat.student);
  if (assigned.length !== studentCount || new Set(numbers).size !== studentCount ||
      assigned.some((seat) => !seat.active) ||
      numbers.some((n) => !Number.isInteger(n) || n < 1 || n > studentCount)) return false;
  return true;
}

function validateAssignmentSettings(studentCount, seats) {
  const error = validateSettings(studentCount, seats);
  if (error) throw new Error(error);
}

function createSeatAssignments(studentCount, seats, random = Math.random) {
  validateAssignmentSettings(studentCount, seats);
  const result = seats.map((seat) => ({ ...seat, student: null }));
  const students = Array.from({ length: studentCount }, (_, i) => i + 1);
  const available = shuffleArray(result.filter((seat) => seat.active), random);
  shuffleArray(students, random).forEach((student, index) => { available[index].student = student; });
  if (!verifyAssignments(studentCount, result)) throw new Error('자리 배정을 완료하지 못했습니다. 다시 시도해주세요.');
  return result;
}




const ROWS = 6;
const COLUMNS = 6;
function createSeats() {
  return Array.from({ length: ROWS * COLUMNS }, (_, index) => ({
    id: `${Math.floor(index / COLUMNS)}-${index % COLUMNS}`,
    row: Math.floor(index / COLUMNS), col: index % COLUMNS, active: true, student: null,
  }));
}
function createInitialState() {
  return { phase: 'welcome', first: 1, last: 26, seats: createSeats(), countdown: null,
    pending: null, manual: null, error: '' };
}

function studentNumbers({ first, last }) {
  return Array.from({ length: last - first + 1 }, (_, index) => first + index);
}

function unassignedNumbers(state) {
  const assigned = new Set(state.seats.map((seat) => seat.student));
  return studentNumbers(state).filter((number) => !assigned.has(number));
}

function canChooseSeat(state, seat) {
  if (!seat.active) return false;
  if (state.pending !== null) return seat.student === null;
  if (state.manual === null || seat.student === state.manual) return false;
  return seat.student === null || state.seats.some((item) => item.student === state.manual);
}

function reduceState(state, action, random = Math.random) {
  if (action.type === 'START' && state.phase === 'welcome') return { ...state, phase: 'setup' };
  if (state.phase === 'countdown') {
    if (action.type === 'TICK') return { ...state, countdown: action.value };
    if (action.type === 'COMPLETE') {
      try {
        const seats = createSeatAssignments(state.last - state.first + 1, state.seats, random)
          .map((seat) => seat.student === null ? seat : { ...seat, student: seat.student + state.first - 1 });
        return { ...state, phase: 'setup', countdown: null, seats };
      } catch (error) {
        return { ...state, phase: 'setup', countdown: null, error: error.message };
      }
    }
    return state;
  }
  if (state.phase !== 'setup') return state;
  const choosing = state.pending !== null || state.manual !== null;
  switch (action.type) {
    case 'SET_RANGE':
      if (choosing || state.seats.some((seat) => seat.student !== null)) return state;
      return isValidStudentCount(action.first) && isValidStudentCount(action.last) && action.first <= action.last
        ? { ...state, first: action.first, last: action.last, error: '' } : state;
    case 'TOGGLE_SEAT':
      if (choosing) return state;
      return { ...state, error: '', seats: state.seats.map((seat) =>
        seat.id === action.id && seat.student === null ? { ...seat, active: !seat.active } : seat) };
    case 'ACTIVATE_ALL':
      return choosing ? state : { ...state, error: '', seats: state.seats.map((seat) => ({ ...seat, active: true })) };
    case 'RESET':
      return { ...state, pending: null, manual: null, error: '',
        seats: state.seats.map((seat) => ({ ...seat, student: null })) };
    case 'ERROR': return { ...state, error: action.message };
    case 'DRAW': {
      if (choosing) return state;
      const remaining = unassignedNumbers(state);
      if (remaining.length === 0) return state;
      if (!state.seats.some((seat) => seat.active && seat.student === null)) {
        return { ...state, error: '사용 가능한 빈자리가 없습니다. 좌석을 더 활성화해주세요.' };
      }
      return { ...state, pending: remaining[Math.floor(random() * remaining.length)], error: '' };
    }
    case 'MANUAL':
      return state.pending === null && studentNumbers(state).includes(action.student)
        ? { ...state, manual: action.student, error: '' } : state;
    case 'CANCEL_SELECTION':
      return { ...state, pending: null, manual: null, error: '' };
    case 'REMOVE_ASSIGNMENT':
      if (state.manual === null) return state;
      return { ...state, manual: null, seats: state.seats.map((seat) =>
        seat.student === state.manual ? { ...seat, student: null } : seat) };
    case 'CHOOSE_SEAT': {
      const target = state.seats.find((seat) => seat.id === action.id);
      if (!target || !canChooseSeat(state, target)) return state;
      const student = state.pending ?? state.manual;
      return { ...state, pending: null, manual: null, error: '', seats: state.seats.map((seat) => {
        if (seat.id === target.id) return { ...seat, student };
        if (seat.student === student) return { ...seat, student: target.student };
        return seat;
      }) };
    }
    case 'SHUFFLE':
      if (choosing || state.seats.some((seat) => seat.student !== null)) return state;
      try {
        // 카운트다운 전에 모든 조건을 검사하되, 실제 결과는 공개 순간 생성합니다.
        validateAssignmentSettings(state.last - state.first + 1, state.seats);
        return { ...state, phase: 'countdown', countdown: 3, error: '' };
      } catch (error) { return { ...state, error: error.message }; }
    default: return state;
  }
}


async function runCountdown(onTick, sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))) {
  onTick(3);
  await sleep(1000);
  onTick(2);
  await sleep(1000);
  onTick(1);
  await sleep(1000);
}

}

let rosterAccount = null;
let rosterNames = {};
let rosterState = 'guest';
let rosterClient;
let rosterRefresh = () => {};
let rosterSession = 0;

function getSeatPrintName(number) {
  return rosterNames[number] ?? '';
}

function seatRosterLoading() {
  return rosterState === 'loading';
}

function renderRosterAccess() {
  const button = document.querySelector('#open-seat-roster');
  if (!button) return;
  button.hidden = !rosterAccount;
  button.disabled = rosterState === 'loading';
  document.querySelector('#roster-print-state').textContent = {
    loading: '학생 이름 불러오는 중…',
    error: '이름을 불러오지 못해 인쇄에는 번호만 표시돼요.',
  }[rosterState] ?? '';
  rosterRefresh();
}

function readRoster(snapshot) {
  const names = snapshot.data()?.names ?? {};
  return Object.fromEntries(Object.entries(names).filter(([number, name]) =>
    /^(?:[1-9]|[12][0-9]|30)$/.test(number) && typeof name === 'string' && name.length <= 24));
}

async function syncSeatRoster(app, uid) {
  const session = ++rosterSession;
  const dialog = document.querySelector('#seat-roster');
  if (dialog?.open) dialog.close();
  document.querySelector('#seat-roster-fields')?.replaceChildren();
  rosterAccount = uid ? { app, uid } : null;
  rosterNames = {};
  rosterClient = null;
  rosterState = uid ? 'loading' : 'guest';
  renderRosterAccess();
  if (!uid) return;

  try {
    const sdk = await import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js');
    const database = sdk.getFirestore(app);
    const ref = sdk.doc(database, 'seatRosters', uid);
    const names = readRoster(await sdk.getDocFromServer(ref));
    if (session !== rosterSession) return;
    rosterClient = { sdk, database, ref };
    rosterNames = names;
    rosterState = 'ready';
  } catch {
    if (session !== rosterSession) return;
    rosterState = 'error';
  }
  renderRosterAccess();
}

function bindSeatRoster(refresh) {
  rosterRefresh = refresh;
  const dialog = document.querySelector('#seat-roster');
  const fields = dialog.querySelector('#seat-roster-fields');
  const status = dialog.querySelector('#seat-roster-status');
  const save = dialog.querySelector('#seat-roster-save');
  const close = dialog.querySelector('#seat-roster-close');
  dialog.addEventListener('cancel', (event) => { if (close.disabled) event.preventDefault(); });
  close.onclick = () => dialog.close();
  dialog.addEventListener('close', () => { if (!dialog.open) fields.replaceChildren(); });

  document.querySelector('#open-seat-roster').onclick = async () => {
    if (!rosterAccount) return;
    if (!rosterClient) await syncSeatRoster(rosterAccount.app, rosterAccount.uid);
    if (!rosterAccount) return;
    fields.replaceChildren();
    close.disabled = false;
    save.disabled = !rosterClient;
    status.textContent = rosterClient ? '' : '이름을 불러오지 못했어요. 닫은 뒤 다시 열어주세요.';
    if (rosterClient) {
      for (let number = 1; number <= 30; number++) {
        const label = document.createElement('label');
        const caption = document.createElement('span');
        const field = document.createElement('input');
        caption.textContent = `${number}번`;
        field.name = String(number);
        field.maxLength = 24;
        field.value = rosterNames[number] ?? '';
        label.append(caption, field);
        fields.append(label);
      }
    }
    if (!dialog.open) dialog.showModal();
  };

  dialog.querySelector('form').onsubmit = async (event) => {
    event.preventDefault();
    if (!rosterClient || save.disabled) return;
    const changes = Array.from(new FormData(event.currentTarget), ([number, value]) => [number, value.trim()])
      .filter(([number, value]) => value !== (rosterNames[number] ?? ''));
    if (!changes.length) { dialog.close(); return; }

    const session = rosterSession;
    const { sdk, database, ref } = rosterClient;
    const inputs = fields.querySelectorAll('input');
    for (const input of inputs) input.disabled = true;
    save.disabled = close.disabled = true;
    status.textContent = '이름을 저장하는 중…';
    try {
      const names = await sdk.runTransaction(database, async (transaction) => {
        const next = readRoster(await transaction.get(ref));
        for (const [number, value] of changes) {
          if (value) next[number] = value;
          else delete next[number];
        }
        transaction.set(ref, { names: next });
        return next;
      });
      if (session !== rosterSession) return;
      rosterNames = names;
      renderRosterAccess();
      dialog.close();
    } catch {
      if (session === rosterSession) status.textContent = '저장하지 못했어요. 연결을 확인한 뒤 다시 시도해주세요.';
    } finally {
      if (session === rosterSession) {
        for (const input of inputs) input.disabled = false;
        save.disabled = close.disabled = false;
      }
    }
  };
  renderRosterAccess();
}

function requestNaverToken() {
  const origin = seatNaverConfig.serverOrigin;
  const popup = window.open(`${origin}/auth/naver/start`, '_blank', 'popup,width=500,height=680');
  if (!popup) return Promise.reject(new Error('팝업을 허용한 뒤 다시 시도해주세요.'));
  return new Promise((resolve, reject) => {
    function finish(error, token) {
      window.removeEventListener('message', receive);
      clearInterval(checkClosed);
      clearTimeout(timeout);
      if (error) reject(error);
      else resolve(token);
    }
    function receive(event) {
      if (event.origin !== origin || event.source !== popup || event.data?.channel !== 'change-seat-naver') return;
      if (typeof event.data.token === 'string') finish(null, event.data.token);
      else finish(new Error('네이버 로그인을 완료하지 못했어요. 다시 시도해주세요.'));
    }
    window.addEventListener('message', receive);
    const checkClosed = setInterval(() => {
      if (popup.closed) finish(new Error('로그인 창이 닫혔어요.'));
    }, 1000);
    const timeout = setTimeout(() => {
      popup.close();
      finish(new Error('로그인 시간이 만료됐어요. 다시 시도해주세요.'));
    }, 600000);
  });
}

const app = document.querySelector('#app');
const $ = (selector) => document.querySelector(selector);
let state = createInitialState();

function dispatch(action) {
  state = reduceState(state, action);
  renderState();
}

function renderState() {
  const counting = state.phase === 'countdown';
  const chosen = state.pending ?? state.manual;
  const choosing = chosen !== null;
  const remaining = unassignedNumbers(state).length;
  const total = state.last - state.first + 1;
  const assigned = total - remaining;
  const active = state.seats.filter((seat) => seat.active).length;
  const free = active - assigned;
  const manualAssigned = state.manual !== null && state.seats.some((seat) => seat.student === state.manual);

  for (const selector of ['#first-number', '#last-number']) $(selector).disabled = counting || choosing || assigned > 0;
  $('#activate-all').disabled = counting || choosing || active === state.seats.length;
  $('#draw').disabled = counting || choosing || remaining === 0;
  $('#shuffle').disabled = counting || choosing || assigned > 0;
  $('#reset').disabled = counting || (!choosing && assigned === 0);
  $('#save-seats').disabled = counting || assigned === 0;
  $('#print-seats').disabled = $('#save-seats').disabled || seatRosterLoading();
  $('#student-total').textContent = total;
  $('#summary-count').textContent = `${remaining}명`;
  $('#available-count').textContent = `${free}석`;
  $('#available-count').classList.toggle('insufficient', free < remaining);
  $('#active-count').textContent = active;
  $('#inactive-count').textContent = state.seats.length - active;
  $('#settings-error').textContent = state.error;
  $('#settings-error').hidden = !state.error;

  const select = $('#manual-student');
  const range = `${state.first}-${state.last}`;
  if (select.dataset.range !== range) {
    select.dataset.range = range;
    select.replaceChildren(new Option('학생 번호 선택', ''),
      ...studentNumbers(state).map((number) => new Option(`${number}번`, number)));
  }
  select.value = state.manual ?? '';
  select.disabled = counting || state.pending !== null;

  $('#selection-panel').hidden = !choosing;
  $('#chosen-number').textContent = choosing ? `${chosen}번` : '';
  $('#selection-instructions').textContent = state.pending !== null
    ? '추첨된 학생이 원하는 빈자리를 고르세요.'
    : manualAssigned ? '빈자리로 옮기거나 다른 학생의 자리를 눌러 서로 바꾸세요.'
      : '배정할 빈자리를 고르세요.';
  $('#remove-assignment').hidden = !manualAssigned;

  const complete = remaining === 0;
  $('#phase-badge').textContent = counting ? '배정 중' : choosing ? '자리 선택 중' : complete ? '배정 완료'
    : assigned ? `${assigned} / ${total}명 배정` : '좌석 설정 중';
  $('#phase-badge').classList.toggle('complete', complete);
  $('#status-message').textContent = complete ? `${total}명의 자리 배정이 완료되었습니다.`
    : assigned ? `${assigned}명 배정 · ${remaining}명 남음` : '번호 범위와 사용할 좌석을 확인해주세요.';

  const buttons = $('#seat-grid').children;
  state.seats.forEach((seat, index) => {
    const button = buttons[index];
    const selectable = choosing && canChooseSeat(state, seat);
    const selected = state.manual !== null && seat.student === state.manual;
    button.disabled = counting || (choosing ? !selectable : seat.student !== null);
    button.classList.toggle('inactive', !seat.active);
    button.classList.toggle('assigned', seat.student !== null);
    button.classList.toggle('selectable', selectable);
    button.classList.toggle('selected', selected);
    if (!choosing && seat.student === null) button.setAttribute('aria-pressed', String(seat.active));
    else button.removeAttribute('aria-pressed');
    const description = !seat.active ? '비활성' : seat.student === null ? '빈자리' : `${seat.student}번`;
    button.setAttribute('aria-label', `${seat.row + 1}행 ${seat.col + 1}열, ${description}`);
    button.firstElementChild.textContent = !seat.active ? '비활성' : seat.student ?? '빈자리';
    button.firstElementChild.className = seat.student === null ? 'seat-caption' : 'seat-number';
    button.lastElementChild.textContent = getSeatPrintName(seat.student);
  });

  $('#countdown-overlay').hidden = !counting;
  $('.app-shell').inert = counting;
  if (counting) $('#countdown-number').textContent = state.countdown;
}

function validateRange() {
  const firstInput = $('#first-number');
  const lastInput = $('#last-number');
  const first = parseStudentCount(firstInput.value);
  const last = parseStudentCount(lastInput.value);
  const reversed = first !== null && last !== null && first > last;
  const valid = first !== null && last !== null && !reversed;
  firstInput.setAttribute('aria-invalid', String(first === null || reversed));
  lastInput.setAttribute('aria-invalid', String(last === null || reversed));
  $('#input-error').hidden = valid;
  $('#input-error').textContent = valid ? '' : reversed ? '끝 번호는 시작 번호 이상이어야 합니다.'
    : '시작 번호와 끝 번호를 1~30 사이 정수로 입력하세요.';
  if (valid && (first !== state.first || last !== state.last)) dispatch({ type: 'SET_RANGE', first, last });
  return valid;
}

function saveSeats() {
  const cells = state.seats.map((seat) => {
    const label = !seat.active ? '비활성' : seat.student === null ? '빈자리' : `${seat.student}번`;
    return `<div class="seat${seat.active ? '' : ' inactive'}">${label}</div>`;
  }).join('');
  const html = `<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 좌석표</title><style>
body { max-width: 800px; margin: 32px auto; padding: 0 16px; font-family: system-ui, sans-serif; }
h1, p { text-align: center; } button { display: block; margin: 20px auto; font: inherit; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat { border: 1px solid #496483; border-radius: 6px; padding: 12px 0; text-align: center; }
.inactive { color: #555; background: #eee; border-style: dashed; }
@media print { button { display: none; } .grid { break-inside: avoid; } }
</style><h1>우리 반 좌석표</h1><p>교실 앞쪽 · 교탁</p><div class="grid">${cells}</div>
<p>교실 뒤쪽</p><button type="button" onclick="window.print()">인쇄 / PDF 저장</button></html>`;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const download = document.createElement('a');
  download.href = url;
  download.download = '우리-반-좌석표.html';
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function start() {
  state = reduceState(state, { type: 'START' });
  app.innerHTML = mainScreen();
  bindSeatAccount();
  for (const seat of state.seats) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'seat';
    button.dataset.seatId = seat.id;
    const printName = document.createElement('span');
    printName.className = 'seat-print-name';
    button.append(document.createElement('span'), printName);
    button.addEventListener('click', () => {
      const choosing = state.pending !== null || state.manual !== null;
      dispatch({ type: choosing ? 'CHOOSE_SEAT' : 'TOGGLE_SEAT', id: seat.id });
      if (choosing) {
        const nextAction = $('#draw').disabled ? $('#manual-student') : $('#draw');
        nextAction.focus({ preventScroll: true });
      }
    });
    $('#seat-grid').append(button);
  }
  for (const selector of ['#first-number', '#last-number']) $(selector).addEventListener('input', validateRange);
  $('#activate-all').addEventListener('click', () => dispatch({ type: 'ACTIVATE_ALL' }));
  $('#draw').addEventListener('click', () => {
    if (!validateRange()) return;
    dispatch({ type: 'DRAW' });
    if (state.pending !== null) $('#selection-status').focus();
  });
  $('#manual-student').addEventListener('change', (event) => {
    if (!validateRange()) { event.target.value = state.manual ?? ''; return; }
    const value = event.target.value;
    dispatch(value ? { type: 'MANUAL', student: Number(value) } : { type: 'CANCEL_SELECTION' });
    if (state.manual !== null) $('#selection-status').focus();
  });
  $('#cancel-selection').addEventListener('click', () => {
    const origin = state.pending !== null ? $('#draw') : $('#manual-student');
    dispatch({ type: 'CANCEL_SELECTION' });
    origin.focus();
  });
  $('#remove-assignment').addEventListener('click', () => {
    dispatch({ type: 'REMOVE_ASSIGNMENT' });
    $('#manual-student').focus();
  });
  $('#reset').addEventListener('click', () => {
    $('#reset-dialog').returnValue = '';
    $('#reset-dialog').showModal();
  });
  $('#reset-dialog').addEventListener('close', (event) => {
    if (event.currentTarget.returnValue === 'reset') {
      dispatch({ type: 'RESET' });
      (validateRange() ? $('#draw') : $('#first-number')).focus();
    }
  });
  $('#shuffle').addEventListener('click', async () => {
    if (!validateRange()) return;
    dispatch({ type: 'SHUFFLE' });
    if (state.phase !== 'countdown') return;
    $('#countdown-overlay').focus();
    await runCountdown((value) => {
      if (state.countdown !== value) dispatch({ type: 'TICK', value });
    });
    dispatch({ type: 'COMPLETE' });
    $('#main-title').focus({ preventScroll: true });
  });
  $('#print-seats').addEventListener('click', () => window.print());
  $('#save-seats').addEventListener('click', saveSeats);
  $('#help').addEventListener('click', () => $('#help-dialog').showModal());
  $('#close-help').addEventListener('click', () => $('#help-dialog').close());
  bindSeatRoster(renderState);
  renderState();
  $('#main-title').focus({ preventScroll: true });
}
