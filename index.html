      (() => {
        let saved;
        try { saved = localStorage.getItem('change-seat-theme'); } catch {}

        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101a18' : '#f6f5f0';
      })();
    </script>

:root {
  color-scheme: light;
  font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --paper: #f6f5f0;
  --surface: #fffefa;
  --ink: #172b28;
  --muted: #50645e;
  --line: #d7e0d8;
  --field: #fffefa;
  --brand: #086853;
  --brand-hover: #075342;
  --on-brand: #fff;
  --blue: #086853;
  --mint: #e0f2e9;
  --warm: #f1efe7;
  --error: #9b3f38;
  --error-bg: #faece7;
  --focus: #b95630;
  --shadow: 0 10px 30px #1b342a0a;
  --dialog-shadow: 0 24px 80px #051f1966;
  --page-width: 1184px;
}

@media screen {
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #101a18;
    --surface: #192825;
    --ink: #e8f3ed;
    --muted: #adc3b9;
    --line: #374c43;
    --field: #13221e;
    --brand: #8ee0c3;
    --brand-hover: #b0ecd4;
    --on-brand: #11382c;
    --blue: #8ee0c3;
    --mint: #243e34;
    --warm: #222f29;
    --error: #ffada3;
    --error-bg: #3f2c2a;
    --focus: #ffaf86;
    --shadow: 0 10px 30px #0002;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); }
h1, h2, p { margin: 0; }
button, select, input { font: inherit; }
button, select { cursor: pointer; }
button:disabled, select:disabled { cursor: default; }
button, input, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
.icon { width: 1.18em; height: 1.18em; flex: none; vertical-align: middle; }
.muted { color: var(--muted); }
.developer-credit { color: var(--muted); font-size: .72rem; font-weight: 500; }
.app-loading { max-width: 38rem; margin: 15vh auto; padding: 1.5rem; }
.app-loading p { margin-top: .75rem; color: var(--muted); line-height: 1.6; }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45em;
  min-height: 42px;
  padding: .52rem .84rem;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: inherit;
  font-size: .88rem;
  font-weight: 700;
  line-height: 1.25;
  white-space: nowrap;
  transition: background-color .16s ease, border-color .16s ease, color .16s ease;
}
.button.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.button.primary:hover:enabled { background: var(--brand-hover); border-color: var(--brand-hover); }
.button.secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
.button.secondary:hover:enabled, .help-button:hover:enabled { background: var(--mint); border-color: var(--brand); }
.button:disabled { opacity: .53; }
.brand { display: flex; align-items: center; gap: .64rem; white-space: nowrap; }
.brand-mark {
  display: inline-grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 10px;
  flex: none;
  background: var(--brand);
  color: var(--on-brand);
}
.brand h1 { font-size: 1.12rem; letter-spacing: -.04em; }
.brand-mark .icon { font-size: 1.04rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; box-shadow: var(--shadow); }

.app-shell { max-width: calc(var(--page-width) + 64px); margin-inline: auto; padding-inline: 32px; }
.app-header {
  min-height: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  border-bottom: 1px solid var(--line);
}
.header-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .42rem; min-width: 0; }
.header-actions .button { min-height: 36px; font-size: .82rem; }
.naver-status { color: var(--muted); font-size: .79rem; max-width: 11rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.naver-status:empty { display: none; }
.help-button { border-color: transparent; color: var(--muted); }
.workspace { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 16px; padding-top: 25px; align-items: start; }
.workspace-heading { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: end; gap: 1rem; }
.workspace-heading h2 { font-size: clamp(2rem, 4vw, 2.85rem); line-height: 1.16; letter-spacing: -.065em; }
.workspace-heading p { margin-top: .38rem; color: var(--muted); font-size: .92rem; line-height: 1.55; }
.workspace-stats {
  display: flex;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}
.workspace-stats > div { min-width: 109px; display: grid; gap: .16rem; padding: .55rem .8rem; }
.workspace-stats > div + div { border-left: 1px solid var(--line); }
.workspace-stats span { color: var(--muted); font-size: .73rem; white-space: nowrap; }
.workspace-stats strong { color: var(--blue); font-size: 1.2rem; letter-spacing: -.04em; }
.workspace-stats .insufficient { color: var(--error); }

.settings { padding: 1.12rem; }
.settings section + section { border-top: 1px solid var(--line); margin-top: .94rem; padding-top: .94rem; }
.settings h2, .classroom h2 { font-size: 1rem; letter-spacing: -.035em; }
.settings h2 { margin-bottom: .61rem; }
.number-range { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: .55rem; }
.number-range label, .manual-controls label { color: var(--muted); display: block; font-size: .78rem; font-weight: 600; margin-bottom: .32rem; }
.range-separator { color: var(--muted); padding-bottom: .63rem; }
.number-range input, .manual-controls select {
  display: block;
  width: 100%;
  min-height: 42px;
  margin: 0;
  padding: .45rem .55rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--field);
  color: var(--ink);
  font-size: .91rem;
}
.number-range input { font-variant-numeric: tabular-nums; font-weight: 750; }
.number-range input:disabled, .manual-controls select:disabled { opacity: .68; }
.number-range input[aria-invalid="true"] { border-color: var(--error); }
.student-total { margin-top: .44rem; color: var(--muted); font-size: .76rem; }
.student-total strong { color: var(--blue); font-variant-numeric: tabular-nums; }
.section-description { color: var(--muted); margin-bottom: .57rem; font-size: .81rem; line-height: 1.5; }
.settings .button { width: 100%; }
.assignment-actions { display: grid; gap: .45rem; }
.manual-controls { margin-top: .72rem; }
.reset-button { margin-top: .51rem; color: var(--muted); min-height: 37px; }
.reset-button:hover:enabled { background: var(--error-bg); color: var(--error); }
.input-error, .settings-error, #seat-logout-error { margin-top: .55rem; color: var(--error); font-size: .82rem; line-height: 1.55; }
.settings-error { padding: .55rem .62rem; margin-bottom: .52rem; border-radius: 8px; background: var(--error-bg); }

.classroom { min-width: 0; padding: 1.08rem; }
.classroom-heading { display: flex; align-items: start; justify-content: space-between; gap: .75rem; margin-bottom: .72rem; }
.classroom h2 { font-size: 1.23rem; }
.room-dimensions { margin-top: .24rem; color: var(--muted); font-size: .77rem; }
.phase-badge {
  display: inline-block;
  padding: .3rem .62rem;
  border-radius: 99px;
  background: var(--mint);
  color: var(--blue);
  font-size: .75rem;
  font-weight: 750;
  white-space: nowrap;
}
.phase-badge.complete { background: var(--brand); color: var(--on-brand); }
.selection-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: .55rem;
  margin-bottom: .65rem;
  padding: .65rem .72rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--mint);
}
#chosen-number { color: var(--blue); font-size: 1.2rem; }
#selection-instructions { color: var(--ink); font-size: .8rem; }
.selection-actions { display: flex; flex-wrap: wrap; gap: .35rem; }
.selection-actions .button { min-height: 35px; font-size: .78rem; }
.room {
  --grid-gap: .43rem;
  padding: .77rem clamp(.55rem, 2.1vw, 1.5rem) .62rem;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--warm);
}
.front-label, .back-label { text-align: center; color: var(--muted); font-size: .72rem; font-weight: 700; }
.front-label { display: flex; justify-content: center; align-items: center; gap: .54rem; }
.front-label span { width: min(18%, 72px); height: 1px; background: var(--line); }
.teacher-desk {
  margin: .4rem auto .45rem;
  width: min(36%, 190px);
  min-width: 4.25rem;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .35rem;
  padding: .32rem .36rem;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink);
  background: var(--surface);
  font-size: .73rem;
  font-weight: 750;
}
.column-labels, .seat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--grid-gap); }
.column-labels { margin-bottom: .23rem; color: var(--muted); font-size: .68rem; text-align: center; }
.seat {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 43px;
  align-items: center;
  justify-content: center;
  padding: .22rem .12rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  text-align: center;
  transition: background-color .16s ease, border-color .16s ease;
}
.seat:hover:enabled { border-color: var(--brand); background: var(--mint); color: var(--ink); }
.seat-caption { font-size: clamp(.61rem, 1.5vw, .79rem); }
.seat.inactive { border-style: dashed; background: transparent; }
.seat.assigned { border-color: transparent; background: var(--mint); color: var(--blue); }
.seat.selectable { border-color: var(--brand); }
.seat.selected, .seat.selectable:hover:enabled { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.seat-number { font-size: clamp(1rem, 2.8vw, 1.22rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.seat-print-name { display: none; }
.back-label { margin-top: .51rem; }
.seat-footer { display: flex; align-items: center; flex-wrap: wrap; gap: .52rem 1.2rem; margin-top: .75rem; }
.legend { display: flex; align-items: center; gap: .68rem; color: var(--muted); font-size: .75rem; }
.legend span { display: inline-flex; align-items: center; gap: .27rem; white-space: nowrap; }
.legend-box { width: .7rem; height: .7rem; border: 1px solid var(--brand); border-radius: 3px; background: var(--mint); }
.legend-box.inactive { border-style: dashed; border-color: var(--muted); background: transparent; }
.export-actions { display: flex; flex-wrap: wrap; gap: .39rem; margin-left: auto; }
.export-actions .button { min-height: 36px; font-size: .78rem; }
#roster-print-state { font-size: .76rem; flex-basis: 100%; }
#roster-print-state:empty { display: none; }
.page-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .35rem 1rem;
  padding-block: .85rem 1.3rem;
  color: var(--muted);
  font-size: .75rem;
}
.app-shell:has(.seat-my-page:not([hidden])) #status-message { display: none; }

dialog { color: var(--ink); }
dialog::backdrop { background: #0b231eb3; }
.help-dialog, .countdown-card {
  width: min(calc(100% - 2rem), 31rem);
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: clamp(1.1rem, 4vw, 1.8rem);
  background: var(--surface);
  box-shadow: var(--dialog-shadow);
}
.confirm-dialog { width: min(calc(100% - 2rem), 25rem); }
.dialog-symbol {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  margin-bottom: .75rem;
  background: var(--mint);
  color: var(--blue);
}
.dialog-symbol .icon { width: 22px; height: 22px; }
.help-dialog h2 { font-size: 1.38rem; letter-spacing: -.055em; line-height: 1.35; }
.help-dialog p, .notice-list { color: var(--muted); font-size: .89rem; line-height: 1.6; }
.help-dialog h2 + p, .help-dialog p + p { margin-top: .51rem; }
.notice-list { padding-left: 1.4rem; margin: .8rem 0; }
.notice-list li + li { margin-top: .35rem; }
.hint { padding: .62rem .72rem; border-radius: 8px; background: var(--warm); }
.dialog-actions, .logout-actions { margin-top: 1.1rem; display: flex; justify-content: flex-end; gap: .4rem; }
.dialog-actions .button, .logout-actions .button { min-width: 5rem; }
#close-help { margin-top: 1.08rem; width: 100%; }
.guide-credit { margin-top: .55rem; text-align: right; }
.countdown-overlay { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: #0b231eb3; }
.countdown-card { text-align: center; }
.countdown-card p { color: var(--ink); font-size: 1.2rem; font-weight: 750; letter-spacing: -.04em; }
.countdown-card > span { color: var(--muted); font-size: .88rem; }
.countdown-number {
  display: grid;
  place-items: center;
  margin: 1rem auto;
  width: 6.2rem;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--mint);
  color: var(--blue);
  font-size: 3.25rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 820px) {
  .app-shell { padding-inline: 1.1rem; }
  .workspace { grid-template-columns: minmax(0, 1fr); gap: .78rem; padding-top: 1.05rem; }
  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
  .settings section + section { margin-top: 0; padding-top: 0; border-top: 0; }
  .settings .assignment-settings { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: .8rem; }
  .assignment-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 520px) {
  .app-shell { padding-inline: .7rem; }
  .app-header { flex-wrap: wrap; gap: .38rem; padding-block: .65rem; }
  .header-actions { flex: 1 0 100%; justify-content: flex-start; }
  .header-actions .naver-status { order: 1; max-width: 100%; }
  .workspace-heading { display: grid; gap: .58rem; }
  .workspace-heading p { font-size: .84rem; }
  .workspace-stats > div { min-width: 0; flex: 1 1 50%; }
  .settings, .classroom { padding: .73rem; }
  .classroom-heading { gap: .32rem; }
  .classroom h2 { font-size: 1.07rem; }
  .room { --grid-gap: .27rem; }
  .seat { min-height: 42px; border-radius: 6px; }
  .export-actions { margin-left: 0; }
}

@media (max-width: 335px) {
  .settings { grid-template-columns: minmax(0, 1fr); }
  .assignment-actions { grid-template-columns: minmax(0, 1fr); }
  .classroom-heading, .seat-footer { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@page { size: A4; margin: 14mm; }
@media print {
  body { background: #fff; color: #14211c; }
  .app-header, .workspace-heading, .page-footer, .settings, .seat-my-page, .selection-panel,
  .phase-badge, .seat-footer, .column-labels, .developer-credit, dialog, .countdown-overlay { display: none !important; }
  .app-shell, #app { width: 100%; max-width: none; margin: 0; padding: 0; }
  .workspace { display: block; padding: 0; }
  .classroom, .room { margin: 0; padding: 0; border: 0; box-shadow: none; background: #fff; }
  .classroom-heading { justify-content: center; text-align: center; margin-bottom: 6mm; }
  .classroom h2 { font-size: 22pt; }
  .room-dimensions { margin-top: 1mm; font-size: 10pt; }
  .room { --grid-gap: 2mm; break-inside: avoid; }
  .teacher-desk { margin: 2mm auto 5mm; padding: 2mm; font-size: 11pt; border-color: #8fa19a; }
  .seat {
    min-height: 20mm;
    flex-direction: column;
    gap: 1mm;
    overflow-wrap: anywhere;
    border: 1px solid #8fa19a;
    background: #fff;
    color: #14211c;
    border-radius: 2mm;
  }
  .seat.assigned { border-color: #54776a; background: #fff; color: #14211c; }
  .seat.inactive { border-style: dashed; color: #56645e; }
  .seat-number { font-size: 14pt; }
  .seat-number::after { content: "번"; font-size: 9pt; }
  .seat-caption { font-size: 9pt; }
  .seat-print-name:not(:empty) { display: block; font-size: 10pt; }
  .back-label { margin-top: 3mm; }
}

.entry-screen {
  --preview-paper: #edf5eb;
  --preview-tile: #e0f2e9;
  --preview-ink: #134b3e;
  --preview-line: #c4dbcc;
  --preview-empty: #f3f6ef;
  --preview-featured: #086853;
  display: flex;
  flex-direction: column;
  width: min(100%, 1248px);
  min-height: 100svh;
  margin-inline: auto;
  padding-inline: clamp(20px, 5vw, 64px);
  color: var(--ink, #172b28);
  background: var(--paper, #f6f5f0);
}

.entry-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: clamp(18px, 4vh, 34px);
  border-bottom: 1px solid var(--line, #d8ded6);
}

.entry-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.035em;
}

.entry-brand .brand-mark {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 10px;
  color: #fff;
  background: #086853;
}

.entry-brand .icon { width: 20px; height: 20px; }

.entry-main {
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(0, 1fr);
  align-items: center;
  gap: clamp(32px, 6vw, 92px);
  margin-block: clamp(42px, 8vh, 82px) clamp(33px, 6vh, 62px);
}

.entry-copy h1 {
  margin: 0;
  font-size: clamp(37px, 5.65vw, 76px);
  line-height: 1.16;
  letter-spacing: -.081em;
  font-weight: 850;
  word-break: keep-all;
}

.entry-copy h1 em { color: var(--blue, #086853); font-style: normal; }

.entry-copy p {
  max-width: 34ch;
  margin: clamp(17px, 3vw, 25px) 0 0;
  font-size: clamp(14px, 1.55vw, 17px);
  line-height: 1.8;
  color: var(--muted, #50665f);
  word-break: keep-all;
  text-wrap: pretty;
}

.entry-copy .start-button {
  display: inline-flex;
  justify-content: space-between;
  width: auto;
  min-width: 174px;
  min-height: 52px;
  margin: clamp(22px, 4vw, 34px) 0 0;
  padding: 10px 16px 10px 20px;
  font-size: 15px;
  border-radius: 12px;
}

.entry-copy .start-button .icon { width: 19px; height: 19px; }

.entry-preview {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: clamp(24px, 4vw, 55px) clamp(24px, 5vw, 77px);
  border: 1px solid var(--preview-line);
  border-radius: 26px;
  background: radial-gradient(circle, var(--preview-line) 1px, transparent 1.4px) 1px 1px / 17px 17px var(--preview-paper);
}

.entry-preview::before,
.entry-preview::after {
  position: absolute;
  z-index: -1;
  width: 65%;
  aspect-ratio: 1;
  border: 1px solid var(--preview-line);
  border-radius: 50%;
  content: '';
  pointer-events: none;
}

    <div id="app"><main class="app-loading"><h1>자리바꾸기를 불러오고 있어요</h1><p>화면이 바뀌지 않으면 최신 버전의 브라우저에서 다시 열어주세요.</p></main></div>

    <script>
function isValidStudentCount(value) {
  return Number.isInteger(value) && value >= 1 && value <= 30;
}

function parseStudentCount(value) {
  if (!/^\d+$/.test(String(value))) return null;
  const count = Number(value);
  return isValidStudentCount(count) ? count : null;
}

function validateSettings(studentCount, seats) {
  if (!isValidStudentCount(studentCount)) return '학생 수는 1명부터 30명까지 입력해주세요.';
  if (seats.filter((seat) => seat.active).length < studentCount) {
    return '학생 수보다 사용 가능한 좌석이 부족합니다.';
  }
  return '';
}



function shuffleArray(array, random = Math.random) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function verifyAssignments(studentCount, seats) {
  const assigned = seats.filter((seat) => seat.student !== null);
  const numbers = assigned.map((seat) => seat.student);
  if (assigned.length !== studentCount || new Set(numbers).size !== studentCount ||
      assigned.some((seat) => !seat.active) ||
      numbers.some((n) => !Number.isInteger(n) || n < 1 || n > studentCount)) return false;
  return true;
}

function validateAssignmentSettings(studentCount, seats) {
  const error = validateSettings(studentCount, seats);
  if (error) throw new Error(error);
}

function createSeatAssignments(studentCount, seats, random = Math.random) {
  validateAssignmentSettings(studentCount, seats);
  const result = seats.map((seat) => ({ ...seat, student: null }));
  const students = Array.from({ length: studentCount }, (_, i) => i + 1);
  const available = shuffleArray(result.filter((seat) => seat.active), random);
  shuffleArray(students, random).forEach((student, index) => { available[index].student = student; });
  if (!verifyAssignments(studentCount, result)) throw new Error('자리 배정을 완료하지 못했습니다. 다시 시도해주세요.');
  return result;
}




const ROWS = 6;
const COLUMNS = 6;
function createSeats() {
  return Array.from({ length: ROWS * COLUMNS }, (_, index) => ({
    id: `${Math.floor(index / COLUMNS)}-${index % COLUMNS}`,
    row: Math.floor(index / COLUMNS), col: index % COLUMNS, active: true, student: null,
  }));
}
function createInitialState() {
  return { phase: 'welcome', first: 1, last: 26, seats: createSeats(), countdown: null,
    pending: null, manual: null, error: '' };
}

function studentNumbers({ first, last }) {
  return Array.from({ length: last - first + 1 }, (_, index) => first + index);
}

function unassignedNumbers(state) {
  const assigned = new Set(state.seats.map((seat) => seat.student));
  return studentNumbers(state).filter((number) => !assigned.has(number));
}

function canChooseSeat(state, seat) {
  if (!seat.active) return false;
  if (state.pending !== null) return seat.student === null;
  if (state.manual === null || seat.student === state.manual) return false;
  return seat.student === null || state.seats.some((item) => item.student === state.manual);
}

function reduceState(state, action, random = Math.random) {
  if (action.type === 'START' && state.phase === 'welcome') return { ...state, phase: 'setup' };
  if (state.phase === 'countdown') {
    if (action.type === 'TICK') return { ...state, countdown: action.value };
    if (action.type === 'COMPLETE') {
      try {
        const seats = createSeatAssignments(state.last - state.first + 1, state.seats, random)
          .map((seat) => seat.student === null ? seat : { ...seat, student: seat.student + state.first - 1 });
        return { ...state, phase: 'setup', countdown: null, seats };
      } catch (error) {
        return { ...state, phase: 'setup', countdown: null, error: error.message };
      }
    }
    return state;
  }
  if (state.phase !== 'setup') return state;
  const choosing = state.pending !== null || state.manual !== null;
  switch (action.type) {
    case 'SET_RANGE':
      if (choosing || state.seats.some((seat) => seat.student !== null)) return state;
      return isValidStudentCount(action.first) && isValidStudentCount(action.last) && action.first <= action.last
        ? { ...state, first: action.first, last: action.last, error: '' } : state;
    case 'TOGGLE_SEAT':
      if (choosing) return state;
      return { ...state, error: '', seats: state.seats.map((seat) =>
        seat.id === action.id && seat.student === null ? { ...seat, active: !seat.active } : seat) };
    case 'ACTIVATE_ALL':
      return choosing ? state : { ...state, error: '', seats: state.seats.map((seat) => ({ ...seat, active: true })) };
    case 'RESET':
      return { ...state, pending: null, manual: null, error: '',
        seats: state.seats.map((seat) => ({ ...seat, student: null })) };
    case 'ERROR': return { ...state, error: action.message };
    case 'DRAW': {
      if (choosing) return state;
      const remaining = unassignedNumbers(state);
      if (remaining.length === 0) return state;
      if (!state.seats.some((seat) => seat.active && seat.student === null)) {
        return { ...state, error: '사용 가능한 빈자리가 없습니다. 좌석을 더 활성화해주세요.' };
      }
      return { ...state, pending: remaining[Math.floor(random() * remaining.length)], error: '' };
    }
    case 'MANUAL':
      return state.pending === null && studentNumbers(state).includes(action.student)
        ? { ...state, manual: action.student, error: '' } : state;
    case 'CANCEL_SELECTION':
      return { ...state, pending: null, manual: null, error: '' };
    case 'REMOVE_ASSIGNMENT':
      if (state.manual === null) return state;
      return { ...state, manual: null, seats: state.seats.map((seat) =>
        seat.student === state.manual ? { ...seat, student: null } : seat) };
    case 'CHOOSE_SEAT': {
      const target = state.seats.find((seat) => seat.id === action.id);
      if (!target || !canChooseSeat(state, target)) return state;
      const student = state.pending ?? state.manual;
      return { ...state, pending: null, manual: null, error: '', seats: state.seats.map((seat) => {
        if (seat.id === target.id) return { ...seat, student };
        if (seat.student === student) return { ...seat, student: target.student };
        return seat;
      }) };
    }
    case 'SHUFFLE':
      if (choosing || state.seats.some((seat) => seat.student !== null)) return state;
      try {
        // 카운트다운 전에 모든 조건을 검사하되, 실제 결과는 공개 순간 생성합니다.
        validateAssignmentSettings(state.last - state.first + 1, state.seats);
        return { ...state, phase: 'countdown', countdown: 3, error: '' };
      } catch (error) { return { ...state, error: error.message }; }
    default: return state;
  }
}


async function runCountdown(onTick, sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))) {
  onTick(3);
  await sleep(1000);
  onTick(2);
  await sleep(1000);
  onTick(1);
  await sleep(1000);
}

let rosterAccount = null;
let rosterNames = {};
let rosterState = 'guest';
let rosterClient;
let rosterRefresh = () => {};
let rosterSession = 0;
let rosterDraft = {};
let rosterSaving = false;
let rosterFilter = 'all';
let rosterFeedback = '';

function getSeatPrintName(number) {
  return rosterNames[number] ?? '';
}

function seatRosterLoading() {
  return rosterState === 'loading';
}

function rosterChanges() {
  return Object.entries(rosterDraft).filter(([number, name]) => name !== (rosterNames[number] ?? ''));
}

function hasUnsavedSeatRoster() {
  return rosterChanges().length > 0;
}

function resetRosterInputs({ resetSearch = false } = {}) {
  rosterDraft = {};
  const form = document.querySelector('#seat-roster-form');
  if (!form) return;
  for (const field of form.querySelectorAll('input[data-roster-name]')) field.value = rosterNames[field.name] ?? '';
  if (resetSearch) {
    form.querySelector('#seat-roster-search').value = '';
    rosterFilter = 'all';
  }
}

function filterRosterRows() {
  const search = document.querySelector('#seat-roster-search');
  if (!search) return;
  const query = search.value.trim().toLocaleLowerCase();
  let visible = 0;
  for (const row of document.querySelectorAll('[data-roster-row]')) {
    const number = row.dataset.rosterRow;
    const name = rosterDraft[number] ?? rosterNames[number] ?? '';
    const saved = Boolean(rosterNames[number]);
    const matchesSearch = `${number}번`.includes(query) || name.toLocaleLowerCase().includes(query);
    row.hidden = !matchesSearch || (rosterFilter === 'saved' && !saved) || (rosterFilter === 'empty' && saved);
    if (!row.hidden) visible++;
  }
  for (const button of document.querySelectorAll('[data-roster-filter]')) {
    button.setAttribute('aria-pressed', String(button.dataset.rosterFilter === rosterFilter));
  }
  document.querySelector('#seat-roster-empty').hidden = visible > 0;
}

function renderRosterEdits() {
  const form = document.querySelector('#seat-roster-form');
  if (!form) return;
  const changes = rosterChanges().length;
  form.querySelector('#seat-roster-status').textContent = rosterSaving ? '이름을 저장하는 중…'
    : rosterFeedback || (changes ? `저장하지 않은 변경 ${changes}건` : '변경 사항 없음');
  for (const id of ['seat-roster-save', 'seat-roster-discard']) {
    form.querySelector(`#${id}`).disabled = !changes || rosterSaving || rosterState !== 'ready';
  }
  for (const row of form.querySelectorAll('[data-roster-row]')) {
    const number = row.dataset.rosterRow;
    const saved = rosterNames[number];
    const changed = Object.hasOwn(rosterDraft, number) && rosterDraft[number] !== (saved ?? '');
    const label = row.querySelector('.roster-row-state');
    label.dataset.state = changed ? 'changed' : saved ? 'saved' : 'empty';
    label.textContent = changed ? '변경됨' : saved ? '등록됨' : '미입력';
    row.querySelector('input').disabled = rosterSaving;
  }
}

function renderRosterAccess() {
  const form = document.querySelector('#seat-roster-form');
  if (!form) return;
  const ready = rosterState === 'ready';
  const count = Object.keys(rosterNames).length;
  form.hidden = !ready;
  document.querySelector('#seat-roster-unavailable').hidden = ready;
  document.querySelector('#seat-roster-retry').hidden = rosterState !== 'error';

  }[rosterState] ?? '';

}

function readRoster(snapshot) {
  const names = snapshot.data()?.names ?? {};
  return Object.fromEntries(Object.entries(names).filter(([number, name]) =>
    /^(?:[1-9]|[12][0-9]|30)$/.test(number) && typeof name === 'string' && name.trim() && name.length <= 24));
}

async function syncSeatRoster(app, uid) {
  const session = ++rosterSession;
  rosterAccount = uid ? { app, uid } : null;
  rosterNames = {};
  rosterClient = null;
  rosterSaving = false;
  rosterFeedback = '';
  resetRosterInputs({ resetSearch: true });
  rosterState = uid ? 'loading' : 'guest';
  renderRosterAccess();
  if (!uid) return;

  try {
    const sdk = await import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js');
    const database = sdk.getFirestore(app);
    const ref = sdk.doc(database, 'seatRosters', uid);
    const names = readRoster(await sdk.getDocFromServer(ref));
    if (session !== rosterSession) return;
    rosterClient = { sdk, database, ref };
    rosterNames = names;
    resetRosterInputs();
    rosterState = 'ready';
  } catch {
    if (session !== rosterSession) return;
    rosterState = 'error';
  }
  renderRosterAccess();
}

function bindSeatRoster(refresh) {
  rosterRefresh = refresh;
  const form = document.querySelector('#seat-roster-form');
  const fields = form.querySelector('#seat-roster-fields');
  for (let number = 1; number <= 30; number++) {
    const row = document.createElement('label');
    row.className = 'roster-row';
    row.dataset.rosterRow = number;
    const caption = document.createElement('span');
    caption.className = 'roster-row-number';
    caption.textContent = `${number}번`;
    const field = document.createElement('input');
    field.name = String(number);
    field.maxLength = 24;
    field.placeholder = '이름 입력';
    field.dataset.rosterName = '';
    field.setAttribute('aria-label', `${number}번 학생 이름`);
    const status = document.createElement('span');
    status.className = 'roster-row-state';
    row.append(caption, field, status);
    fields.append(row);
  }
  resetRosterInputs();
  fields.oninput = ({ target }) => {
    if (!target.matches('input[data-roster-name]')) return;
    rosterDraft[target.name] = target.value.trim();
    rosterFeedback = '';
    renderRosterEdits();
  };
  form.querySelector('#seat-roster-search').oninput = filterRosterRows;
  for (const button of form.querySelectorAll('[data-roster-filter]')) {
    button.onclick = () => { rosterFilter = button.dataset.rosterFilter; filterRosterRows(); };
  }
  form.querySelector('#seat-roster-discard').onclick = () => {
    resetRosterInputs();
    rosterFeedback = '저장하지 않은 변경을 취소했어요.';
    renderRosterAccess();
  };
  document.querySelector('#seat-roster-retry').onclick = () => {
    if (rosterAccount && rosterState === 'error') void syncSeatRoster(rosterAccount.app, rosterAccount.uid);
  };

  form.onsubmit = async (event) => {
    event.preventDefault();
    if (!rosterClient || rosterSaving) return;
    const changes = rosterChanges();
    if (!changes.length) return;

    const session = rosterSession;
    const { sdk, database, ref } = rosterClient;
    rosterSaving = true;
    renderRosterEdits();
    try {
      const names = await sdk.runTransaction(database, async (transaction) => {
        const next = readRoster(await transaction.get(ref));
        for (const [number, value] of changes) {
          if (value) next[number] = value;
          else delete next[number];
        }
        transaction.set(ref, { names: next });
        return next;
      });
      if (session !== rosterSession) return;
      rosterNames = names;
      resetRosterInputs();
      rosterFeedback = '학생 이름을 저장했어요.';
    } catch {
      if (session === rosterSession) rosterFeedback = '저장하지 못했어요. 연결을 확인한 뒤 다시 시도해주세요.';
    } finally {
      if (session === rosterSession) {
        rosterSaving = false;
        renderRosterAccess();
      }
    }
  };
  renderRosterAccess();
}

function requestNaverToken() {
  const origin = seatNaverConfig.serverOrigin;
  const popup = window.open(`${origin}/auth/naver/start`, '_blank', 'popup,width=500,height=680');
  if (!popup) return Promise.reject(new Error('팝업을 허용한 뒤 다시 시도해주세요.'));
  return new Promise((resolve, reject) => {
    function finish(error, token) {
      window.removeEventListener('message', receive);
      clearInterval(checkClosed);
      clearTimeout(timeout);
      if (error) reject(error);
      else resolve(token);
    }
    function receive(event) {
      if (event.origin !== origin || event.source !== popup || event.data?.channel !== 'change-seat-naver') return;
      if (typeof event.data.token === 'string') finish(null, event.data.token);
      else finish(new Error('네이버 로그인을 완료하지 못했어요. 다시 시도해주세요.'));
    }
    window.addEventListener('message', receive);
    const checkClosed = setInterval(() => {
      if (popup.closed) finish(new Error('로그인 창이 닫혔어요.'));
    }, 1000);
    const timeout = setTimeout(() => {
      popup.close();
      finish(new Error('로그인 시간이 만료됐어요. 다시 시도해주세요.'));
    }, 600000);
  });
}

    const sdk = 'https://www.gstatic.com/firebasejs/13.4.0';
    const [app, authSdk] = await Promise.all([import(`${sdk}/firebase-app.js`), import(`${sdk}/firebase-auth.js`)]);
    seatAuthSdk = authSdk;
    const firebaseApp = app.initializeApp(seatNaverConfig.firebase);
    seatAuth = authSdk.getAuth(firebaseApp);
    await authSdk.setPersistence(seatAuth, authSdk.browserSessionPersistence);
    await seatAuth.authStateReady();
    seatUser = seatAuth.currentUser;
    seatAuthReady = true;
    if (seatUser && dialog.open) { dialog.close(); enter(); }
    authSdk.onAuthStateChanged(seatAuth, (user) => {
      seatUser = user;
      renderSeatAccount();
      void syncSeatRoster(firebaseApp, user?.uid ?? null);
    });
    for (const button of dialog.querySelectorAll('[data-provider]')) {
      button.onclick = async () => {
        if (seatAuthBusy) return;
        const google = button.dataset.provider === 'google';
        seatAuthBusy = true;
        seatLoginNotice = '새 창에서 로그인을 완료해주세요.';
        renderSeatAccount();
        try {
          const result = google ? await authSdk.signInWithPopup(seatAuth, new authSdk.GoogleAuthProvider())
            : await authSdk.signInWithCustomToken(seatAuth, await requestNaverToken());
          seatUser = result.user;
          seatLoginNotice = '';
          if (dialog.open) dialog.close();
          enter();
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain') seatLoginNotice = '이 주소는 아직 구글 로그인에 등록되지 않았어요.';
          else if (error.code === 'auth/popup-blocked') seatLoginNotice = '팝업을 허용한 뒤 다시 시도해주세요.';
          else if (error.code === 'auth/popup-closed-by-user') seatLoginNotice = '로그인 창이 닫혔어요.';
          else seatLoginNotice = google ? '구글 로그인을 완료하지 못했어요. 다시 시도해주세요.'
            : error.code ? '네이버 계정을 연결하지 못했어요. 다시 시도해주세요.' : error.message;
        } finally {
          seatAuthBusy = false;
          renderSeatAccount();
        }
      };
    }
    renderSeatAccount();
  } catch {
    seatLoginNotice = '로그인을 불러오지 못했어요. 로그인 없이 시작할 수 있어요.';

const app = document.querySelector('#app');
const $ = (selector) => document.querySelector(selector);
let state = createInitialState();

function renderThemeToggle() {
  const button = $('[data-theme-toggle]');
  button.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
}

app.addEventListener('click', (event) => {
  if (!event.target.closest('[data-theme-toggle]')) return;
  const dark = document.documentElement.dataset.theme !== 'dark';
  const theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  $('meta[name="theme-color"]').content = dark ? '#101a18' : '#f6f5f0';
  try { localStorage.setItem('change-seat-theme', theme); } catch {}
  renderThemeToggle();
});

function dispatch(action) {
  state = reduceState(state, action);
  renderState();
}

function renderState() {
  const counting = state.phase === 'countdown';
  const chosen = state.pending ?? state.manual;
  const choosing = chosen !== null;
  const remaining = unassignedNumbers(state).length;
  const total = state.last - state.first + 1;
  const assigned = total - remaining;
  const active = state.seats.filter((seat) => seat.active).length;
  const free = active - assigned;
  const manualAssigned = state.manual !== null && state.seats.some((seat) => seat.student === state.manual);

  for (const selector of ['#first-number', '#last-number']) $(selector).disabled = counting || choosing || assigned > 0;
  $('#activate-all').disabled = counting || choosing || active === state.seats.length;
  $('#draw').disabled = counting || choosing || remaining === 0;
  $('#shuffle').disabled = counting || choosing || assigned > 0;
  $('#reset').disabled = counting || (!choosing && assigned === 0);
  $('#save-seats').disabled = counting || assigned === 0;
  $('#print-seats').disabled = $('#save-seats').disabled || seatRosterLoading();
  $('#student-total').textContent = total;
  $('#summary-count').textContent = `${remaining}명`;
  $('#available-count').textContent = `${free}석`;
  $('#available-count').classList.toggle('insufficient', free < remaining);
  $('#active-count').textContent = active;
  $('#inactive-count').textContent = state.seats.length - active;
  $('#settings-error').textContent = state.error;
  $('#settings-error').hidden = !state.error;

  const select = $('#manual-student');
  const range = `${state.first}-${state.last}`;
  if (select.dataset.range !== range) {
    select.dataset.range = range;
    select.replaceChildren(new Option('학생 번호 선택', ''),
      ...studentNumbers(state).map((number) => new Option(`${number}번`, number)));
  }
  select.value = state.manual ?? '';
  select.disabled = counting || state.pending !== null;

  $('#selection-panel').hidden = !choosing;
  $('#chosen-number').textContent = choosing ? `${chosen}번` : '';
  $('#selection-instructions').textContent = state.pending !== null
    ? '추첨된 학생이 원하는 빈자리를 고르세요.'
    : manualAssigned ? '빈자리로 옮기거나 다른 학생의 자리를 눌러 서로 바꾸세요.'
      : '배정할 빈자리를 고르세요.';
  $('#remove-assignment').hidden = !manualAssigned;

  const complete = remaining === 0;
  $('#phase-badge').textContent = counting ? '배정 중' : choosing ? '자리 선택 중' : complete ? '배정 완료'
    : assigned ? `${assigned} / ${total}명 배정` : '좌석 설정 중';
  $('#phase-badge').classList.toggle('complete', complete);
  $('#status-message').textContent = complete ? `${total}명의 자리 배정이 완료되었습니다.`
    : assigned ? `${assigned}명 배정 · ${remaining}명 남음` : '번호 범위와 사용할 좌석을 확인해주세요.';

  const buttons = $('#seat-grid').children;
  state.seats.forEach((seat, index) => {
    const button = buttons[index];
    const selectable = choosing && canChooseSeat(state, seat);
    const selected = state.manual !== null && seat.student === state.manual;
    button.disabled = counting || (choosing ? !selectable : seat.student !== null);
    button.classList.toggle('inactive', !seat.active);
    button.classList.toggle('assigned', seat.student !== null);
    button.classList.toggle('selectable', selectable);
    button.classList.toggle('selected', selected);
    if (!choosing && seat.student === null) button.setAttribute('aria-pressed', String(seat.active));
    else button.removeAttribute('aria-pressed');
    const description = !seat.active ? '비활성' : seat.student === null ? '빈자리' : `${seat.student}번`;
    button.setAttribute('aria-label', `${seat.row + 1}행 ${seat.col + 1}열, ${description}`);
    button.firstElementChild.textContent = !seat.active ? '비활성' : seat.student ?? '빈자리';
    button.firstElementChild.className = seat.student === null ? 'seat-caption' : 'seat-number';
    button.lastElementChild.textContent = getSeatPrintName(seat.student);
  });

  $('#countdown-overlay').hidden = !counting;
  $('.app-shell').inert = counting;
  if (counting) $('#countdown-number').textContent = state.countdown;
}

function validateRange() {
  const firstInput = $('#first-number');
  const lastInput = $('#last-number');
  const first = parseStudentCount(firstInput.value);
  const last = parseStudentCount(lastInput.value);
  const reversed = first !== null && last !== null && first > last;
  const valid = first !== null && last !== null && !reversed;
  firstInput.setAttribute('aria-invalid', String(first === null || reversed));
  lastInput.setAttribute('aria-invalid', String(last === null || reversed));
  $('#input-error').hidden = valid;
  $('#input-error').textContent = valid ? '' : reversed ? '끝 번호는 시작 번호 이상이어야 합니다.'
    : '시작 번호와 끝 번호를 1~30 사이 정수로 입력하세요.';
  if (valid && (first !== state.first || last !== state.last)) dispatch({ type: 'SET_RANGE', first, last });
  return valid;
}

function saveSeats() {
  const cells = state.seats.map((seat) => {
    const label = !seat.active ? '비활성' : seat.student === null ? '빈자리' : `${seat.student}번`;
    return `<div class="seat${seat.active ? '' : ' inactive'}">${label}</div>`;
  }).join('');
  const html = `<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 좌석표</title><style>
body { max-width: 800px; margin: 32px auto; padding: 0 16px; background: #f6f5f0; color: #172b28; font-family: system-ui, "Malgun Gothic", sans-serif; }
h1, p { text-align: center; }
button { display: block; margin: 20px auto; padding: 9px 16px; border: 0; border-radius: 8px; background: #086853; color: #fff; font: inherit; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat { border: 1px solid #9ab0a7; border-radius: 8px; padding: 12px 2px; background: #fffefa; text-align: center; font-size: clamp(.67rem, 3vw, 1rem); }
.inactive { color: #50645e; background: transparent; border-style: dashed; }
@media print { body { background: #fff; } button { display: none; } .grid { break-inside: avoid; } }
</style><h1>우리 반 좌석표</h1><p>교실 앞쪽 · 교탁</p><div class="grid">${cells}</div>
<p>교실 뒤쪽</p><button type="button" onclick="window.print()">인쇄 / PDF 저장</button></html>`;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const download = document.createElement('a');
  download.href = url;
  download.download = '우리-반-좌석표.html';
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function start() {
  state = reduceState(state, { type: 'START' });
  app.innerHTML = mainScreen();
  renderThemeToggle();
  bindSeatAccount();
  for (const seat of state.seats) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'seat';
    button.dataset.seatId = seat.id;
    const printName = document.createElement('span');
    printName.className = 'seat-print-name';
    button.append(document.createElement('span'), printName);
    button.addEventListener('click', () => {
      const choosing = state.pending !== null || state.manual !== null;
      dispatch({ type: choosing ? 'CHOOSE_SEAT' : 'TOGGLE_SEAT', id: seat.id });
      if (choosing) {
        const nextAction = $('#draw').disabled ? $('#manual-student') : $('#draw');
        nextAction.focus({ preventScroll: true });
      }
    });
    $('#seat-grid').append(button);
  }
  for (const selector of ['#first-number', '#last-number']) $(selector).addEventListener('input', validateRange);
  $('#activate-all').addEventListener('click', () => dispatch({ type: 'ACTIVATE_ALL' }));
  $('#draw').addEventListener('click', () => {
    if (!validateRange()) return;
    dispatch({ type: 'DRAW' });
    if (state.pending !== null) $('#selection-status').focus();
  });
  $('#manual-student').addEventListener('change', (event) => {
    if (!validateRange()) { event.target.value = state.manual ?? ''; return; }
    const value = event.target.value;
    dispatch(value ? { type: 'MANUAL', student: Number(value) } : { type: 'CANCEL_SELECTION' });
    if (state.manual !== null) $('#selection-status').focus();
  });
  $('#cancel-selection').addEventListener('click', () => {
    const origin = state.pending !== null ? $('#draw') : $('#manual-student');
    dispatch({ type: 'CANCEL_SELECTION' });
    origin.focus();
  });
  $('#remove-assignment').addEventListener('click', () => {
    dispatch({ type: 'REMOVE_ASSIGNMENT' });
    $('#manual-student').focus();
  });
  $('#reset').addEventListener('click', () => {
    $('#reset-dialog').returnValue = '';
    $('#reset-dialog').showModal();
  });
  $('#reset-dialog').addEventListener('close', (event) => {
    if (event.currentTarget.returnValue === 'reset') {
      dispatch({ type: 'RESET' });
      (validateRange() ? $('#draw') : $('#first-number')).focus();
    }
  });
  $('#shuffle').addEventListener('click', async () => {
    if (!validateRange()) return;
    dispatch({ type: 'SHUFFLE' });
    if (state.phase !== 'countdown') return;
    $('#countdown-overlay').focus();
    await runCountdown((value) => {
      if (state.countdown !== value) dispatch({ type: 'TICK', value });
    });
    dispatch({ type: 'COMPLETE' });
    $('#main-title').focus({ preventScroll: true });
  });
  $('#print-seats').addEventListener('click', () => window.print());
  $('#save-seats').addEventListener('click', saveSeats);
  $('#help').addEventListener('click', () => $('#help-dialog').showModal());
  $('#close-help').addEventListener('click', () => $('#help-dialog').close());
  bindSeatRoster(renderState);
  renderState();
  $('#main-title').focus({ preventScroll: true });
}
